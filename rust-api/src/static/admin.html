<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambu Farm - Task Logs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .login-container.hidden {
            display: none;
        }

        .admin-console {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            width: 100%;
        }

        .admin-console.hidden {
            display: none;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px 12px 0 0;
        }

        .header h1 {
            color: white;
            margin: 0;
            font-size: 24px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .refresh-btn, .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            width: auto;
            font-size: 13px;
        }

        .refresh-btn:hover, .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .content {
            padding: 20px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select {
            width: auto;
            min-width: 150px;
        }

        .filter-bar input {
            width: auto;
            min-width: 240px;
        }

        .table-container {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .table thead {
            background: #f9f9f9;
        }

        .table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            white-space: nowrap;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        .table tr:hover {
            background: #f9f9f9;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .badge.queued {
            background: #fef0e6;
            color: #d97706;
        }

        .badge.inprogress {
            background: #f0e6ff;
            color: #9333ea;
        }

        .badge.completed {
            background: #e6f3ff;
            color: #0891b2;
        }

        .badge.cancelled {
            background: #f3f4f6;
            color: #6b7280;
        }

        .badge.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: auto;
            margin-right: 5px;
        }

        .action-btn.complete {
            background: #d1fae5;
            color: #059669;
        }

        .action-btn.complete:hover {
            background: #a7f3d0;
        }

        .action-btn.delete {
            background: #fee2e2;
            color: #dc2626;
        }

        .action-btn.delete:hover {
            background: #fecaca;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .file-path {
            font-family: monospace;
            font-size: 11px;
            color: #666;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .job-id {
            font-family: monospace;
            font-size: 11px;
            color: #666;
        }

        .datetime {
            font-size: 13px;
            white-space: nowrap;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f9f9f9;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .stat-item strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div id="login" class="login-container">
        <h1>🖨️ Bambu Farm</h1>
        <p class="subtitle">Task Logs</p>
        <div id="loginAlert"></div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button onclick="login()">Sign In</button>
    </div>

    <div id="console" class="admin-console hidden">
        <div class="header">
            <h1>📋 Task Logs</h1>
            <div class="header-controls">
                <button class="refresh-btn" onclick="loadJobs()">🔄 Refresh</button>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="content">
            <div class="stats-bar">
                <div class="stat-item">Queued: <strong id="statQueued">0</strong></div>
                <div class="stat-item">In Progress: <strong id="statInProgress">0</strong></div>
                <div class="stat-item">Completed: <strong id="statCompleted">0</strong></div>
            </div>

            <div class="filter-bar">
                <label style="margin:0">Filter by Status:</label>
                <select id="statusFilter" onchange="renderTable()">
                    <option value="all">All</option>
                    <option value="queued">Queued</option>
                    <option value="inprogress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="error">Error</option>
                </select>
                <label style="margin:0">Search:</label>
                <input type="text" id="searchInput" placeholder="Name, period, teacher, job id..." onkeyup="renderTable()">
            </div>

            <div class="table-container">
                <div id="jobsList" class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let allJobs = [];
        const API_BASE = '';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('loginAlert');

            console.log('[LOGIN] Attempting login for username:', username);

            if (!username || !password) {
                console.warn('[LOGIN] Missing credentials');
                alertDiv.innerHTML = '<div class="alert error">Please enter username and password</div>';
                return;
            }

            try {
                console.log('[LOGIN] Sending POST to', `${API_BASE}/auth/login`);
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                console.log('[LOGIN] Response status:', response.status);
                const data = await response.json();
                console.log('[LOGIN] Response data:', data);

                if (response.ok) {
                    token = data.token;
                    console.log('[LOGIN] ✓ Login successful, token:', token.substring(0, 10) + '...');
                    localStorage.setItem('token', token);
                    showConsole();
                    loadJobs();
                } else {
                    console.error('[LOGIN] ✗ Login failed:', data.error);
                    alertDiv.innerHTML = `<div class="alert error">${esc(data.error || 'Login failed')}</div>`;
                }
            } catch (e) {
                console.error('[LOGIN] ✗ Network error:', e);
                alertDiv.innerHTML = '<div class="alert error">Connection error: ' + e.message + '</div>';
            }
        }

        async function logout() {
            localStorage.removeItem('token');
            token = null;
            document.getElementById('login').classList.remove('hidden');
            document.getElementById('console').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function showConsole() {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('console').classList.remove('hidden');
        }

        async function loadJobs() {
            console.log('[LOAD_JOBS] Fetching jobs...');
            try {
                const url = `${API_BASE}/api/v2/jobs`;
                console.log('[LOAD_JOBS] Endpoint:', url);
                console.log('[LOAD_JOBS] Token:', token ? token.substring(0, 10) + '...' : 'NO TOKEN');
                
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                console.log('[LOAD_JOBS] Response status:', response.status);

                if (response.status === 401) {
                    console.warn('[LOAD_JOBS] ✗ Unauthorized (401) - logging out');
                    logout();
                    return;
                }

                const data = await response.json();
                console.log('[LOAD_JOBS] Response data:', data);
                console.log('[LOAD_JOBS] Data is array?', Array.isArray(data));
                console.log('[LOAD_JOBS] Job count:', Array.isArray(data) ? data.length : 'N/A');
                
                if (Array.isArray(data)) {
                    allJobs = data;
                    console.log('[LOAD_JOBS] ✓ Loaded', data.length, 'jobs');
                    updateStats(data);
                    renderTable();
                } else {
                    console.error('[LOAD_JOBS] ✗ Response is not an array:', typeof data);
                    document.getElementById('jobsList').innerHTML = '<div class="loading">Error: Invalid response format</div>';
                }
            } catch (e) {
                console.error('[LOAD_JOBS] ✗ Network error:', e);
                document.getElementById('jobsList').innerHTML = '<div class="loading">Error loading jobs: ' + e.message + '</div>';
            }
        }

        function updateStats(jobs) {
            document.getElementById('statQueued').textContent = jobs.filter(j => j.status === 'queued').length;
            document.getElementById('statInProgress').textContent = jobs.filter(j => j.status === 'inprogress').length;
            document.getElementById('statCompleted').textContent = jobs.filter(j => j.status === 'completed').length;
        }

        function renderTable() {
            const statusFilter = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allJobs.slice();
            if (statusFilter !== 'all') {
                filtered = filtered.filter(job => job.status === statusFilter);
            }

            if (search) {
                filtered = filtered.filter(job => {
                    const searchable = [
                        job.student_name,
                        job.class_period,
                        job.teacher,
                        job.id,
                        job.file_path,
                        job.filename,
                        job.status,
                    ].join(' ').toLowerCase();
                    return searchable.includes(search);
                });
            }

            filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (filtered.length === 0) {
                document.getElementById('jobsList').innerHTML = '<div class="loading">No jobs found.</div>';
                return;
            }

            const html = `<table class="table" id="jobsTable"><thead><tr>
                <th>Date/Time</th>
                <th>Name</th>
                <th>Period</th>
                <th>Teacher</th>
                <th>Job ID</th>
                <th>File Location</th>
                <th>Status</th>
                <th>Actions</th>
            </tr></thead><tbody>${filtered.map(job => {
                const created = new Date(job.created_at);
                const completed = job.completed_at ? new Date(job.completed_at) : null;
                const canComplete = job.status === 'queued' || job.status === 'inprogress';
                const canDelete = job.status === 'completed';

                return `<tr>
                    <td class="datetime">${created.toLocaleDateString()} ${created.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${completed ? `<br><span style="color:#0891b2;font-size:11px">Completed: ${completed.toLocaleString()}</span>` : ''}</td>
                    <td>${esc(job.student_name)}</td>
                    <td>${esc(job.class_period)}</td>
                    <td>${esc(job.teacher)}</td>
                    <td class="job-id">${esc(job.id)}</td>
                    <td class="file-path" title="${esc(job.file_path)}">${esc(job.file_path)}</td>
                    <td><span class="badge ${esc(job.status)}">${esc(job.status)}</span></td>
                    <td>
                        ${canComplete ? `<button class="action-btn complete" onclick="completeJob('${esc(job.id)}')">Mark Complete</button>` : ''}
                        ${canDelete ? `<button class="action-btn delete" onclick="deleteJob('${esc(job.id)}')">Delete</button>` : ''}
                    </td>
                </tr>`;
            }).join('')}</tbody></table>`;

            document.getElementById('jobsList').innerHTML = html;
        }

        async function completeJob(jobId) {
            console.log('[COMPLETE_JOB] Marking job', jobId, 'as complete');
            if (!confirm('Mark this job as completed?')) return;
            try {
                const url = `${API_BASE}/api/v2/jobs/${jobId}/complete`;
                console.log('[COMPLETE_JOB] POST to', url);
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                console.log('[COMPLETE_JOB] Response status:', response.status);
                
                if (response.ok) {
                    console.log('[COMPLETE_JOB] ✓ Job marked complete');
                    loadJobs();
                } else {
                    const data = await response.json();
                    console.error('[COMPLETE_JOB] ✗ Error:', data.error);
                    alert(`Error: ${data.error || 'Failed to complete job'}`);
                }
            } catch (e) {
                console.error('[COMPLETE_JOB] ✗ Network error:', e);
                alert('Network error: ' + e.message);
            }
        }

        async function deleteJob(jobId) {
            console.log('[DELETE_JOB] Deleting job', jobId);
            if (!confirm('Delete this completed job and remove the file from disk?')) return;
            try {
                const url = `${API_BASE}/api/v2/jobs/${jobId}`;
                console.log('[DELETE_JOB] DELETE to', url);
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                console.log('[DELETE_JOB] Response status:', response.status);
                
                if (response.ok) {
                    console.log('[DELETE_JOB] ✓ Job deleted');
                    loadJobs();
                } else {
                    const data = await response.json();
                    console.error('[DELETE_JOB] ✗ Error:', data.error);
                    alert(`Error: ${data.error || 'Failed to delete job'}`);
                }
            } catch (e) {
                console.error('[DELETE_JOB] ✗ Network error:', e);
                alert('Network error: ' + e.message);
            }
        }

        function esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        setInterval(() => {
            if (token) {
                loadJobs();
            }
        }, 30000);

        console.log('[INIT] Page loading, checking for existing token...');
        if (token) {
            console.log('[INIT] ✓ Token found in localStorage, showing console');
            showConsole();
            loadJobs();
        } else {
            console.log('[INIT] No token found, showing login form');
        }
    </script>
</body>
</html>
